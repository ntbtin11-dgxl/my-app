<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <div class="max-w-6xl mx-auto bg-white p-8 rounded shadow">
    <!-- Navbar điều hướng -->
    <div class="flex space-x-4 border-b pb-4 mb-6">
      <button onclick="chuyenTab('formContainer')" class="px-4 py-2 bg-blue-600 text-white rounded">Tạo Phiếu / Đánh giá</button>
      <button onclick="taiDanhSach()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Tổng hợp / Xem lại</button>
    </div>

    <!-- Màn hình 1: Form đánh giá -->
    <div id="formContainer">
      <h2 class="text-2xl font-bold mb-4 text-center">BẢN TỰ ĐÁNH GIÁ, XẾP LOẠI</h2>
      <form id="danhGiaForm" onsubmit="xuLyLuuPhieu(event)">
        <input type="hidden" id="phieuId" name="id">
        <input type="hidden" id="isEdit" name="isEdit" value="false">
        
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block font-semibold">Họ và tên (Ví dụ: Nguyễn Văn Hưng)</label>
            <input type="text" id="hoTen" class="w-full border p-2 rounded" required>
          </div>
          <div>
            <label class="block font-semibold">Quý/Năm</label>
            <input type="text" id="quyNam" placeholder="Quý 3/2026" class="w-full border p-2 rounded" required>
          </div>
        </div>
        
        <!-- Đưa các tiêu chí chấm điểm chi tiết vào đây... -->
        
        <div class="flex space-x-4">
          <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded font-bold">Lưu Dữ Liệu</button>
          <button type="button" onclick="xuatPDF()" class="px-6 py-2 bg-red-600 text-white rounded font-bold">Lưu & Xuất PDF vào Drive</button>
        </div>
      </form>
    </div>

    <!-- Màn hình 2: Bảng tổng hợp -->
    <div id="listContainer" class="hidden">
      <h2 class="text-2xl font-bold mb-4">Danh sách tổng hợp đánh giá</h2>
      <table class="min-w-full border-collapse border border-gray-300">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2">Họ tên</th>
            <th class="border p-2">Quý/Năm</th>
            <th class="border p-2">Tổng điểm</th>
            <th class="border p-2">Xếp loại</th>
            <th class="border p-2">Thao tác</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dữ liệu render từ server -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function chuyenTab(tabId) {
      document.getElementById('formContainer').classList.add('hidden');
      document.getElementById('listContainer').classList.add('hidden');
      document.getElementById(tabId).classList.remove('hidden');
    }

    function xuLyLuuPhieu(e) {
      e.preventDefault();
      // Thu thập data
      const data = {
        id: document.getElementById('phieuId').value,
        isEdit: document.getElementById('isEdit').value === 'true',
        hoTen: document.getElementById('hoTen').value,
        quyNam: document.getElementById('quyNam').value,
        // Thêm các trường điểm số...
      };

      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        document.getElementById('danhGiaForm').reset();
      }).luuPhieuDanhGia(data);
    }

    function taiDanhSach() {
      chuyenTab('listContainer');
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="text-center p-4">Đang tải dữ liệu...</td></tr>';
      
      google.script.run.withSuccessHandler(rows => {
        let html = '';
        rows.forEach(row => {
          html += `
            <tr>
              <td class="border p-2">${row.HoTen}</td>
              <td class="border p-2">${row.QuyNam}</td>
              <td class="border p-2 text-center">${row.TongDiem || ''}</td>
              <td class="border p-2 text-center">${row.XepLoai || ''}</td>
              <td class="border p-2 text-center">
                <button onclick="xemChiTiet('${row.ID}')" class="text-blue-600 underline">Sửa</button>
              </td>
            </tr>`;
        });
        document.getElementById('tableBody').innerHTML = html;
      }).layDanhSachPhieu();
    }

    function xuatPDF() {
      const data = {
        hoTen: document.getElementById('hoTen').value,
        quyNam: document.getElementById('quyNam').value,
        donVi: 'THPT', // Lấy từ input
        tongDiem: 95, // Tính toán từ form
        xepLoai: 'Hoàn thành xuất sắc nhiệm vụ'
      };
      
      alert("Đang tạo PDF và lưu vào Drive. Vui lòng đợi...");
      google.script.run.withSuccessHandler(res => {
        if(res.status === 'success') {
          alert('Đã tạo thành công! Link: ' + res.url);
          window.open(res.url, '_blank');
        } else {
          alert('Lỗi: ' + res.message);
        }
      }).taoFilePDF(data);
    }
    
    // Hàm xemChiTiet() sẽ gọi google.script.run để lấy 1 bản ghi và điền ngược lại vào form, set isEdit = true.
  </script>
</body>
</html>
